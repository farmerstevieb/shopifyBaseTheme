extends: theme-check:recommended

# These checks are genuinely useful signal but have been confirmed, via
# repeated real `shopify theme push` attempts against a live store, to NOT
# actually block a push -- Shopify's server-side validation lets them
# through. Downgraded to warning (still visible, still worth fixing) rather
# than error, so a pre-push validation gate doesn't block a genuinely
# deployable build on pre-existing, non-blocking issues.
TranslationKeyExists:
  severity: warning
MissingAsset:
  severity: warning
MissingTemplate:
  severity: warning
